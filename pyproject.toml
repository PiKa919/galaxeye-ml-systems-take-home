[project]
name = "galaxeye"
version = "0.1.0"
description = "Offline land-use tile classification with two local CPU model versions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "streamlit>=1.64.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "ultralytics>=8.4.161",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
